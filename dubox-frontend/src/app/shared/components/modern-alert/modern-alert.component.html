<div class="alert-backdrop" *ngIf="show" (click)="onBackdropClick($event)">
  <div class="alert-container" 
       [class.alert-success]="type === 'success'"
       [class.alert-error]="type === 'error'"
       [class.alert-warning]="type === 'warning'"
       [class.alert-info]="type === 'info'"
       (click)="$event.stopPropagation()">
    
    <!-- Icon -->
    <div class="alert-icon">
      <!-- Success Icon -->
      <svg *ngIf="type === 'success'" xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
        <polyline points="22 4 12 14.01 9 11.01"/>
      </svg>
      
      <!-- Error Icon -->
      <svg *ngIf="type === 'error'" xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/>
        <line x1="15" y1="9" x2="9" y2="15"/>
        <line x1="9" y1="9" x2="15" y2="15"/>
      </svg>
      
      <!-- Warning Icon -->
      <svg *ngIf="type === 'warning'" xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
        <line x1="12" y1="9" x2="12" y2="13"/>
        <line x1="12" y1="17" x2="12.01" y2="17"/>
      </svg>
      
      <!-- Info Icon -->
      <svg *ngIf="type === 'info'" xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="16" x2="12" y2="12"/>
        <line x1="12" y1="8" x2="12.01" y2="8"/>
      </svg>
    </div>

    <!-- Content -->
    <div class="alert-content">
      <h3 class="alert-title">{{ title }}</h3>
      <p class="alert-message">{{ message }}</p>
    </div>

    <!-- Actions -->
    <div class="alert-actions">
      <button class="btn-ok" (click)="onClose()">OK</button>
    </div>
  </div>
</div>
